server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/drivers_service_dev
    username: postgres
    password: sasa
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update  # Permite que Hibernate cree la tabla automáticamente
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true  # Muestra las consultas SQL en la consola
